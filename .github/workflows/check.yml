name: Book check

# On every push and pull request: runs the code, checks that the Output boxes are up to date,
# compiles the book, checks the notebooks, and attaches the compiled PDF as a downloadable artifact.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      MPLBACKEND: Agg
      PYTHONHASHSEED: "0"
      SOURCE_DATE_EPOCH: "1767225600"   # fixed date in matplotlib PDFs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: code/requirements-ci.txt

      - name: Python packages
        run: pip install -r code/requirements-ci.txt

      - name: TeX Live
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended lmodern

      - name: Run the code and refresh the Output boxes
        run: python3 tools/run_blocks.py ch*.tex

      - name: Are the Output boxes up to date?
        run: |
          if ! git diff --quiet -- 'ch*.tex'; then
            git diff --stat -- 'ch*.tex'
            git diff -- 'ch*.tex' | head -80
            echo "::error::The Output boxes in the book do not match the code. Run 'python3 tools/run_blocks.py ch*.tex' locally and push the changes."
            exit 1
          fi

      - name: Are the index commands up to date?
        run: |
          python3 tools/make_index.py add
          if ! git diff --quiet -- 'ch*.tex'; then
            git diff --stat -- 'ch*.tex'
            echo "::warning::The index commands do not match the text; run 'python3 tools/make_index.py add' and push. (The updated version is used in this run.)"
          fi

      - name: Compile the book
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error main.tex > /dev/null
          python3 tools/make_index.py compile
          pdflatex -interaction=nonstopmode -halt-on-error main.tex > /dev/null
          pdflatex -interaction=nonstopmode -halt-on-error main.tex > /dev/null

      - name: Compilation log (undefined references, overfull boxes)
        run: python3 tools/check_log.py main.log --limit 4

      - name: Does each chapter compile on its own?
        run: |
          mkdir -p _single
          for f in ch*.tex; do
            pdflatex -interaction=nonstopmode -halt-on-error -output-directory=_single "$f" > /dev/null \
              || { echo "::error::$f did not compile on its own"; exit 1; }
          done

      - name: Are the notebooks up to date, and do they run?
        run: |
          python3 tools/make_notebooks.py --check
          python3 tools/make_notebooks.py --run

      - name: Attach the PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: statistical-theory-pdf
          path: main.pdf
          if-no-files-found: warn
